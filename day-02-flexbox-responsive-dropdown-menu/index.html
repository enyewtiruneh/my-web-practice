<!DOCTYPE html>
<head>
    <meta charset=""UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Navigation</title>
    <link rel="stylesheet" href="style/flat-nav.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>
<body>

    <!-- Header Logo & description -->
    <header class="header-container">

        <!-- Header Logo -->
        <div class="logo-container">
            <h2 class="header-logo"><span>Flat</span>Navigation</h2>
            <h3 class="logo-sub-title">Desktop & Mobile</h3>
        </div>
        <!-- Header left side description -->
        <ul class="description">
            <li>100% Vector Shapes</li>
            <li>Clean & Simple</li>
            <li>Easy to Edit</li>
        </ul>

    </header>
    <!--end of Header -->

    <!-- Navbar-->
     <nav class="nav-container">
        <h3 class="nav-logo">Your<span>Company</span></h3>

        <input type="checkbox" id="toggle-menu" class="toggle-menu">
        <label for="toggle-menu" class="humburger">
            <i class="fa fa-bars"></i>
        </label>
    
        <ul class="nav-links">
            <i class="fa fa-caret-up"></i>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="search-bar-container">
            <input type="text" id="search-txt" class="search-box" placeholder="Search">
            <label for="search-txt" class="search-lbl">Search</label>
            <button class="search-btn">
                <i class="fa fa-magnifying-glass"></i>
                <!--<i class="fa fa-caret-up"></i>-->
            </button>
        </div>
     </nav>
     <!-- End of Navigation -->

</body>
</html>
